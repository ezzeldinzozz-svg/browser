<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="tabstrip">
    <div id="tablist" role="tablist" aria-label="Tabs"></div>
    <button id="newtab" title="New tab" aria-label="New tab">+</button>
  </div>
  <div id="toolbar">
    <button id="back" title="Back" aria-label="Back" disabled>&#8249;</button>
    <button id="forward" title="Forward" aria-label="Forward" disabled>&#8250;</button>
    <button id="reload" title="Reload" aria-label="Reload">&#8635;</button>
    <span id="private-badge" hidden>Private</span>
    <div id="omnibox">
      <button id="site" hidden></button>
      <input id="address" type="text" spellcheck="false" autocomplete="off" placeholder="Search or enter address" aria-label="Address and search bar">
      <div id="addrview" aria-hidden="true"></div>
      <button id="zoom" hidden title="Reset zoom"></button>
      <div id="suggest" hidden></div>
    </div>
    <button id="shield" hidden>
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5z" fill="currentColor"/></svg>
      <span id="shield-count"></span>
    </button>
    <button id="star" title="Bookmark this page" aria-label="Bookmark this page" disabled>&#9734;</button>
    <button id="downloads" title="Downloads" aria-label="Downloads">&#8615;</button>
    <button id="update" hidden>Restart to update</button>
  </div>
  <div id="bmbar" role="toolbar" aria-label="Bookmarks bar" hidden></div>
  <div id="dlwarn" class="bar" hidden>
    <span id="dlwarn-text"></span>
    <button id="dlwarn-discard" class="primary">Discard</button>
    <button id="dlwarn-keep">Keep</button>
  </div>
  <div id="prompt" hidden role="alert">
    <span id="prompt-text"></span>
    <button id="prompt-allow" class="primary">Allow</button>
    <button id="prompt-block">Block</button>
    <button id="prompt-close" class="close" title="Not now">&times;</button>
  </div>
  <form id="authbar" hidden>
    <span id="auth-text"></span>
    <input id="auth-user" type="text" autocomplete="off" spellcheck="false" placeholder="Username">
    <input id="auth-pass" type="password" autocomplete="off" placeholder="Password">
    <button id="auth-ok" type="submit" class="primary">Sign in</button>
    <button id="auth-cancel" type="button">Cancel</button>
  </form>
  <div id="findbar" hidden>
    <input id="find-input" type="text" spellcheck="false" autocomplete="off" placeholder="Find in page">
    <span id="find-count"></span>
    <button id="find-prev" title="Previous match">&#8963;</button>
    <button id="find-next" title="Next match">&#8964;</button>
    <button id="find-close" class="close" title="Close">&times;</button>
  </div>
  <div id="backdrop" hidden></div>
  <div id="sitepopup" hidden></div>
  <div id="dlpanel" hidden></div>
  <form id="bmpopup" hidden>
    <div class="bm-title" id="bm-heading"></div>
    <label>Name <input id="bm-name" type="text" spellcheck="false" autocomplete="off"></label>
    <label id="bm-folder-row">Folder <select id="bm-folder"></select></label>
    <div class="bm-actions">
      <button id="bm-remove" type="button">Remove</button>
      <button id="bm-done" type="submit" class="primary">Done</button>
    </div>
  </form>
  <div id="screenpicker" hidden>
    <div class="sp-box">
      <div class="sp-title" id="sp-title"></div>
      <div class="sp-grid" id="sp-grid"></div>
      <div class="sp-actions">
        <button id="sp-cancel">Cancel</button>
        <button id="sp-share" class="primary" disabled>Share</button>
      </div>
    </div>
  </div>
  <script src="ui.js"></script>
</body>
</html>
