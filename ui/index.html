<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src data: crx:">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="tabstrip">
    <div id="sidebar-head">
      <button id="sidebar-toggle" title="Collapse vertical tabs" aria-label="Toggle vertical tabs width"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16"/></svg></button>
      <button id="workspace" title="Workspaces" aria-label="Workspaces" hidden><span id="workspace-name"></span></button>
    </div>
    <div id="tablist" role="tablist" aria-label="Tabs"></div>
    <button id="newtab" title="New tab" aria-label="New tab"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="newtab-label">New tab</span></button>
  </div>
  <div id="toolbar">
    <button id="back" title="Back" aria-label="Back" disabled><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button id="forward" title="Forward" aria-label="Forward" disabled><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button>
    <button id="reload" title="Reload" aria-label="Reload"><svg class="ico go" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg><svg class="ico stop" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <button id="home" title="Home" aria-label="Home" hidden><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/></svg></button>
    <span id="private-badge" hidden>Private</span>
    <div id="omnibox">
      <button id="site" hidden></button>
      <input id="address" type="text" spellcheck="false" autocomplete="off" placeholder="Search or enter address" aria-label="Address and search bar">
      <div id="addrview" aria-hidden="true"></div>
      <button id="capture" hidden title="Stop sharing"></button>
      <button id="zoom" hidden title="Reset zoom"></button>
      <div id="suggest" role="listbox" aria-label="Suggestions" hidden></div>
    </div>
    <button id="media" hidden title="Media playing" aria-label="Media playing">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>
    </button>
    <button id="shield" hidden aria-label="Ad and tracker blocking">
      <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M12 2.5 4.5 5.4v5.8c0 4.7 3.2 8.8 7.5 10.3 4.3-1.5 7.5-5.6 7.5-10.3V5.4z" fill="currentColor"/></svg>
      <span id="shield-count"></span>
    </button>
    <browser-action-list id="extensions" alignment="bottom left"></browser-action-list>
    <button id="reader" hidden title="Reader mode (⌥⌘R)" aria-label="Reader mode">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 10h14M5 14h9M5 18h12"/></svg>
    </button>
    <button id="star" title="Bookmark this page" aria-label="Bookmark this page" disabled><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z"/></svg></button>
    <button id="split-btn" title="Toggle Split View (⌥⌘\)" aria-label="Toggle Split View" hidden><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M12 4v16"/></svg></button>
    <button id="screenshot-btn" title="Take Screenshot (⇧⌘S)" aria-label="Take Screenshot" hidden><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-2h6l2 2h3a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2z"/><circle cx="12" cy="13.5" r="3.2"/></svg></button>
    <button id="translate-btn" title="Translate Page" aria-label="Translate Page" hidden><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h10M9 3v2M6 5c0 4.5 2.5 8 6.5 9.5M11.5 5C10.5 9 8 12.5 4 14.5"/><path d="M13 19l4-9 4 9M14.3 16h5.4"/></svg></button>
    <button id="readaloud-btn" title="Read Page Aloud" aria-label="Read Page Aloud" hidden><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4.5 4.5 0 0 1 0 6M18.8 6.5a8 8 0 0 1 0 11"/></svg></button>
    <button id="bookmarks-btn" title="Bookmarks" aria-label="Bookmarks" hidden><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12a1 1 0 0 1 1 1v15l-7-4-7 4V5a1 1 0 0 1 1-1z"/></svg></button>
    <button id="history-btn" title="History" aria-label="History" hidden><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></button>
    <button id="downloads" title="Downloads" aria-label="Downloads"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></button>
    <button id="profile" title="Profile" aria-label="Profiles"><span id="profile-initial"></span></button>
    <button id="settings-btn" title="Settings (⌘,)" aria-label="Settings"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.77 1.02 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    <button id="update" hidden>Restart to update</button>
  </div>
  <div id="bmbar" role="toolbar" aria-label="Bookmarks bar" hidden></div>
  <div id="restorebar" class="bar" hidden role="alert">
    <span id="restore-text">Operecs didn't shut down correctly.</span>
    <button id="restore-yes" class="primary">Restore pages</button>
    <button id="restore-no">Dismiss</button>
  </div>
  <div id="dlwarn" class="bar" role="alert" hidden>
    <span id="dlwarn-text"></span>
    <button id="dlwarn-discard" class="primary">Discard</button>
    <button id="dlwarn-keep">Keep</button>
  </div>
  <div id="prompt" hidden role="alert">
    <span id="prompt-text"></span>
    <button id="prompt-allow" class="primary">Allow</button>
    <button id="prompt-block">Block</button>
    <button id="prompt-close" class="close" title="Not now" aria-label="Not now">&times;</button>
  </div>
  <form id="authbar" role="alert" hidden>
    <span id="auth-text"></span>
    <input id="auth-user" aria-label="Username" type="text" autocomplete="off" spellcheck="false" placeholder="Username">
    <input id="auth-pass" aria-label="Password" type="password" autocomplete="off" placeholder="Password">
    <button id="auth-ok" type="submit" class="primary">Sign in</button>
    <button id="auth-cancel" type="button">Cancel</button>
  </form>
  <div id="findbar" role="search" hidden>
    <input id="find-input" aria-label="Find in page" type="text" spellcheck="false" autocomplete="off" placeholder="Find in page">
    <span id="find-count"></span>
    <button id="find-prev" title="Previous match" aria-label="Previous match">&#8963;</button>
    <button id="find-next" title="Next match" aria-label="Next match">&#8964;</button>
    <button id="find-close" class="close" title="Close" aria-label="Close find bar">&times;</button>
  </div>
  <div id="backdrop" hidden></div>
  <div id="sitepopup" role="dialog" aria-label="Site information" hidden></div>
  <div id="dlpanel" role="dialog" aria-label="Downloads" hidden></div>
  <form id="bmpopup" role="dialog" aria-labelledby="bm-heading" hidden>
    <div class="bm-title" id="bm-heading"></div>
    <label>Name <input id="bm-name" type="text" spellcheck="false" autocomplete="off"></label>
    <label id="bm-folder-row">Folder <select id="bm-folder"></select></label>
    <div class="bm-actions">
      <button id="bm-remove" type="button">Remove</button>
      <button id="bm-done" type="submit" class="primary">Done</button>
    </div>
  </form>
  <div id="devicepicker" hidden>
    <div class="sp-box dp-box" role="dialog" aria-labelledby="dp-title">
      <div class="sp-title" id="dp-title"></div>
      <div class="dp-list" id="dp-list" role="listbox"></div>
      <div class="dp-status" id="dp-status"></div>
      <div class="sp-actions">
        <button id="dp-cancel">Cancel</button>
        <button id="dp-connect" class="primary" disabled>Connect</button>
      </div>
    </div>
  </div>
  <div id="screenpicker" hidden>
    <div class="sp-box" role="dialog" aria-labelledby="sp-title">
      <div class="sp-title" id="sp-title"></div>
      <div class="sp-grid" id="sp-grid"></div>
      <div class="sp-actions">
        <button id="sp-cancel">Cancel</button>
        <button id="sp-share" class="primary" disabled>Share</button>
      </div>
    </div>
  </div>
  <div id="tabpreview" role="tooltip" hidden>
    <img id="tp-img" alt="" hidden>
    <div class="tp-meta">
      <div id="tp-title"></div>
      <div id="tp-domain"></div>
    </div>
  </div>
  <script src="ui.js"></script>
</body>
</html>
