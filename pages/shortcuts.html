<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Keyboard Shortcuts</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'">
  <link rel="stylesheet" href="page.css">
</head>
<body>
  <main>
    <h1>Keyboard shortcuts</h1>
    <p class="hint">Click a shortcut badge to record a new key combination. Press <kbd>Esc</kbd> to cancel or <kbd>⌫</kbd> to restore its default.</p>
    <div id="list"></div>
    <div class="buttons" style="margin-top: 24px"><button id="reset" hidden>Reset custom shortcuts</button></div>
  </main>
  <script src="shortcuts.js"></script>
</body>
</html>
