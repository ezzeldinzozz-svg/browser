<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Reader</title>
  <!-- The article comes from a website, so it's shown in a sandboxed frame without scripts. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src https: http: data:; media-src https: http:">
  <link rel="stylesheet" href="reader.css">
</head>
<body>
  <div id="bar" role="toolbar" aria-label="Reader settings">
    <button id="exit" title="Leave reader mode">← Original page</button>
    <span class="spacer"></span>
    <button id="smaller" title="Smaller text" aria-label="Smaller text">A−</button>
    <button id="bigger" title="Larger text" aria-label="Larger text">A+</button>
    <select id="font" aria-label="Font"><option value="serif">Serif</option><option value="sans">Sans-serif</option></select>
    <select id="width" aria-label="Line width"><option value="narrow">Narrow</option><option value="medium">Medium</option><option value="wide">Wide</option></select>
    <select id="theme" aria-label="Theme"><option value="auto">Automatic</option><option value="light">Light</option><option value="sepia">Sepia</option><option value="dark">Dark</option></select>
  </div>
  <iframe id="article" sandbox="allow-popups allow-popups-to-escape-sandbox" title="Article" hidden></iframe>
  <main id="missing" hidden>
    <h1>This article is no longer available</h1>
    <p>Reader mode keeps articles only until Operecs closes.</p>
    <button id="open-original">Open the original page</button>
  </main>
  <script src="reader.js"></script>
</body>
</html>
