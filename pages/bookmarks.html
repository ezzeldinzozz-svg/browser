<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bookmarks</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
  <link rel="stylesheet" href="page.css">
</head>
<body>
  <main class="wide">
    <h1>Bookmarks</h1>
    <div class="bar">
      <input id="q" type="search" placeholder="Search bookmarks" autocomplete="off">
      <button id="new-folder">New folder</button>
      <select id="import"><option value="">Import…</option></select>
      <button id="export">Export…</button>
    </div>
    <p id="notice" class="hint" hidden></p>
    <div class="manager">
      <nav id="folders" aria-label="Folders"></nav>
      <section id="list" aria-live="polite"></section>
    </div>
  </main>
  <script src="bookmarks.js"></script>
</body>
</html>
