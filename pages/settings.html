<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Settings</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
  <link rel="stylesheet" href="page.css">
</head>
<body>
  <main>
    <h1>Settings</h1>
    <h2>On startup</h2>
    <label class="check"><input id="restore" type="checkbox"> Reopen the tabs that were open last time</label>

    <h2>Privacy</h2>
    <label class="check"><input id="adblock" type="checkbox"> Block ads and trackers</label>
    <p class="hint">Sites where blocking is turned off (use the shield in the toolbar to change a site):</p>
    <div id="allowlist"></div>

    <h2>Site permissions</h2>
    <p class="hint">Sites you've allowed or blocked. Reset a site to be asked again next time.</p>
    <div id="list"></div>
  </main>
  <script src="settings.js"></script>
</body>
</html>
