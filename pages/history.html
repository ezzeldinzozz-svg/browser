<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>History</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'">
  <link rel="stylesheet" href="page.css">
</head>
<body>
  <main>
    <h1>History</h1>
    <div class="bar">
      <input id="q" aria-label="Search history" type="search" placeholder="Search history" autocomplete="off">
      <button id="clear">Clear all</button>
    </div>
    <div class="bar" id="import-bar" hidden>
      <select id="import-source"></select>
      <button id="import">Import history</button>
      <span id="import-result" class="hint"></span>
    </div>
    <div id="list"></div>
  </main>
  <script src="history.js"></script>
</body>
</html>
