<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Can't reach this page</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'">
  <link rel="stylesheet" href="page.css">
</head>
<body>
  <main class="error">
    <h1 id="heading">This page can't be reached</h1>
    <p id="detail"></p>
    <p id="url" class="error-url"></p>
    <p id="desc" class="error-code"></p>
    <button id="retry">Try again</button>
    <button id="continue-http" hidden>Continue to site</button>
    <button id="network-login" hidden>Sign in to the network</button>
    <p id="network-hint" class="hint" hidden>On hotel, airport or café Wi-Fi? Its sign-in page may be blocking sites until you sign in.</p>
  </main>
  <script src="error.js"></script>
</body>
</html>
